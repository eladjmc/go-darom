name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: go_darom
          POSTGRES_PASSWORD: go_darom_dev
          POSTGRES_DB: go_darom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go_darom -d go_darom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://go_darom:go_darom_dev@localhost:5432/go_darom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
